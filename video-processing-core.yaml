AWSTemplateFormatVersion: '2010-09-09'
Description: Core resources for video transcription and summarization pipeline.

Resources:

  VideoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: video-upload-bucket-input

  SummaryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: video-summary-bucket-outputs

  SummaryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SummaryBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowTranscribeToWriteOutput
            Effect: Allow
            Principal:
              Service: transcribe.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub arn:aws:s3:::${SummaryBucket}/*

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: VideoTranscriptionAndSummaryRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FullTranscribeAndBedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - transcribe:StartTranscriptionJob
                  - transcribe:GetTranscriptionJob
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - arn:aws:s3:::video-upload-bucket-input/*
                  - arn:aws:s3:::video-summary-bucket-outputs/*
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: arn:aws:bedrock:*::foundation-model/anthropic.claude-3-5-sonnet-20240620-v1:0
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  VideoProcessingLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ProcessVideoAndSummarize
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      Code:
        ZipFile: |
          import boto3
          import time
          import json
          import urllib.parse

          s3 = boto3.client('s3')
          transcribe = boto3.client('transcribe')
          bedrock = boto3.client('bedrock-runtime')

          def handler(event, context):
              print("[INFO] Lambda triggered")
              try:
                  # 1. Get uploaded file details
                  record = event['Records'][0]
                  bucket = record['s3']['bucket']['name']
                  key = urllib.parse.unquote_plus(record['s3']['object']['key'])

                  print(f"[INFO] New file detected: s3://{bucket}/{key}")

                  job_name = f"transcribe-{int(time.time())}"
                  media_uri = f"s3://{bucket}/{key}"
                  output_bucket = 'video-summary-bucket-outputs'

                  # 2. Start transcription job with speaker diarization
                  print(f"[INFO] Starting transcription job: {job_name}")
                  transcribe.start_transcription_job(
                      TranscriptionJobName=job_name,
                      Media={'MediaFileUri': media_uri},
                      MediaFormat='mp4',
                      LanguageCode='en-US',
                      OutputBucketName=output_bucket,
                      Settings={
                          'ShowSpeakerLabels': True,
                          'MaxSpeakerLabels': 10
                      }
                  )

                  # 3. Poll for completion
                  print("[INFO] Polling transcription job status...")
                  while True:
                      status = transcribe.get_transcription_job(TranscriptionJobName=job_name)
                      job_status = status['TranscriptionJob']['TranscriptionJobStatus']
                      print(f"[DEBUG] Transcription status: {job_status}")
                      if job_status in ['COMPLETED', 'FAILED']:
                          break
                      time.sleep(10)

                  if job_status == 'FAILED':
                      raise Exception("Transcription failed.")

                  # 4. Fetch the transcription file from S3
                  transcript_key = f"{job_name}.json"
                  print(f"[INFO] Fetching transcript from S3: {transcript_key}")
                  obj = s3.get_object(Bucket=output_bucket, Key=transcript_key)
                  transcript_data = json.loads(obj['Body'].read().decode('utf-8'))

                  # 5. Build speaker-labeled dialogue
                  print("[INFO] Processing diarized transcript...")
                  items = transcript_data['results']['items']
                  dialogue = []
                  current_speaker = None
                  current_line = []

                  for item in items:
                      if item['type'] != 'pronunciation':
                          continue

                      word = item['alternatives'][0]['content']
                      speaker = item.get('speaker_label', 'unknown')

                      if speaker != current_speaker:
                          if current_line:
                              dialogue.append(f"{current_speaker}: {' '.join(current_line)}")
                          current_speaker = speaker
                          current_line = [word]
                      else:
                          current_line.append(word)

                  if current_line:
                      dialogue.append(f"{current_speaker}: {' '.join(current_line)}")

                  diarized_transcript = '\n'.join(dialogue)
                  print(f"[INFO] Diarized transcript built with {len(dialogue)} speaker turns")

                  # 6. Send formatted prompt to Claude 3.5 via Bedrock
                  print("[INFO] Sending transcript to Claude 3.5 Sonnet")
                  prompt_content = f"""
                  As a professional summarizer, create a structured summary of the following conversation transcript. Your task is to:

                  1. Craft a summary that is detailed, thorough, and insightful, while remaining clear and concise.
                  2. Extract the main ideas and critical information from the conversation, omitting irrelevant or redundant language.
                  3. Base your response solely on the provided content — do not introduce outside knowledge.
                  4. Format your response into structured meeting notes using the following sections:
                  - Attendees (if identifiable)
                  - Key Topics Discussed
                  - Action Items
                  - Next Steps
                  5. Present the notes in well-formatted paragraph form or bullet points for readability.

                  Here is the transcript:
                  {diarized_transcript}
                  """
                  
                  body = {
                      "anthropic_version": "bedrock-2023-05-31",
                      "messages": [
                          {
                              "role": "user",
                              "content": prompt_content
                          }
                      ],
                      "max_tokens": 50000,
                      "temperature": 0.7,
                      "top_p": 0.9
                  }

                  response = bedrock.invoke_model(
                      modelId='anthropic.claude-3-5-sonnet-20240620-v1:0',
                      body=json.dumps(body),
                      contentType='application/json',
                      accept='application/json'
                  )

                  response_body = json.loads(response['body'].read().decode())
                  summary = ''.join(block['text'] for block in response_body['content'] if block['type'] == 'text')

                  print(f"[INFO] Summary generated successfully. Length: {len(summary)} characters")

                  # 7. Save the summary back to S3
                  output_key = key.replace('.mp4', '-summary.txt')
                  print(f"[INFO] Uploading summary to S3: {output_key}")
                  s3.put_object(
                      Bucket=output_bucket,
                      Key=output_key,
                      Body=summary.encode('utf-8')
                  )

                  print("[SUCCESS] Lambda completed successfully")
                  return {
                      "status": "Success",
                      "summaryS3Key": output_key
                  }

              except Exception as e:
                  print(f"[ERROR] {str(e)}")
                  raise



  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VideoProcessingLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt VideoBucket.Arn

Outputs:
  VideoBucketName:
    Description: Upload bucket
    Value: !Ref VideoBucket

  SummaryBucketName:
    Description: Summary bucket
    Value: !Ref SummaryBucket

  LambdaArn:
    Description: Lambda ARN
    Value: !GetAtt VideoProcessingLambda.Arn
